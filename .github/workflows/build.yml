name: Build vBot

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: Android
            os: ubuntu-latest
            target: Android64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build vBot
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          combine: true

  package:
    name: Package vBot
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload vBot
        uses: actions/upload-artifact@v4
        with:
          name: vBot
          path: ${{ steps.build.outputs.build-output }}
